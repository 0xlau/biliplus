<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light" />
    <title>BiliPlus · 隐藏指定用户</title>
    <link rel="stylesheet" href="./css/settings.css" />
    <script src="../scripts/common/bilibili-api.js" defer></script>
    <script src="./js/settings-hide-user-comment.js" defer></script>
  </head>
  <body class="options-page detail-page" aria-busy="true">
    <header class="topbar">
      <a class="brand" href="./settings.html#tools" aria-label="返回 BiliPlus 设置">
        <img src="./img/logo_128.png" alt="" width="36" height="36" />
        <span>BiliPlus</span>
      </a>
      <div class="save-state" id="user-status" role="status" aria-live="polite" data-state="saving">
        <span class="save-state__dot" aria-hidden="true"></span>
        <span>正在读取屏蔽列表…</span>
      </div>
    </header>

    <main class="detail-shell">
      <a class="back-link" href="./settings.html#tools">
        <svg aria-hidden="true" viewBox="0 0 24 24"><path d="m15 5-7 7 7 7" /></svg>
        返回其他工具
      </a>

      <header class="detail-hero">
        <h1>隐藏指定用户评论</h1>
        <p>按用户名或 UID 添加屏蔽对象。设置保存在浏览器同步存储中，刷新视频页后完全生效。</p>
      </header>

      <section class="setting-section user-manager" aria-labelledby="add-user-title">
        <header class="section-heading">
          <div>
            <h2 id="add-user-title">添加用户</h2>
            <p>优先使用完整用户名或数字 UID，以避免匹配到同名账号。</p>
          </div>
        </header>
        <form class="user-form" id="user-form">
          <label for="user-id-box">B 站用户名或 UID</label>
          <div class="user-search-row">
            <input id="user-id-box" name="user" type="text" autocomplete="off" required disabled placeholder="例如：码农小易 或 393341686" />
            <button class="primary-action" id="add-user" type="submit" disabled>添加</button>
          </div>
        </form>
      </section>

      <section class="setting-section user-manager" aria-labelledby="hidden-users-title">
        <header class="section-heading">
          <div>
            <h2 id="hidden-users-title" tabindex="-1">已隐藏用户</h2>
            <p>移除后不会恢复已经从当前页面隐藏的评论，刷新视频页即可重新显示。</p>
          </div>
        </header>
        <p class="empty-state" id="empty-state" hidden>还没有隐藏任何用户。</p>
        <div class="user-grid" id="user-list"></div>
      </section>
    </main>
  </body>
</html>
